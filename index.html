<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전국 법원경매물건 지도</title>
  <style>
    :root {
      --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:rgba(148,163,184,0.18);
      --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }
    body { font-family:"Segoe UI",-apple-system,"Malgun Gothic",sans-serif; background:var(--bg);
      color:var(--text); display:flex; flex-direction:column; height:100vh; overflow:hidden; }
    header { flex:0 0 auto; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line);
      display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    header h1 { font-size:17px; white-space:nowrap; }
    header h1 .dot { color:var(--accent); }
    .src-badge { font-size:11px; color:#34d399; background:rgba(52,211,153,0.12);
      border:1px solid rgba(52,211,153,0.3); padding:3px 10px; border-radius:999px; white-space:nowrap; }
    select { font-family:inherit; font-size:13px; color:var(--text); background:var(--panel2);
      border:1px solid var(--line); padding:7px 12px; border-radius:8px; cursor:pointer; }
    .filters { display:flex; gap:7px; margin-left:auto; flex-wrap:wrap; }
    .filters button { font-family:inherit; font-size:13px; cursor:pointer; color:var(--muted);
      background:var(--panel2); border:1px solid var(--line); padding:6px 12px; border-radius:999px; transition:all .15s; }
    .filters button:hover { color:var(--text); }
    .filters button.active { color:#0f172a; font-weight:600; }
    .main { flex:1 1 auto; display:flex; min-height:0; }
    .sidebar { flex:0 0 340px; background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:12px; }
    .count { font-size:13px; color:var(--muted); padding:4px 6px 12px; }
    .item { background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:14px;
      margin-bottom:10px; cursor:pointer; transition:all .15s; }
    .item:hover { border-color:var(--accent); transform:translateY(-1px); }
    .item.active { border-color:var(--accent); box-shadow:0 0 0 2px rgba(56,189,248,.3); }
    .item .top { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
    .type-tag { font-size:11px; font-weight:700; color:#fff; padding:2px 8px; border-radius:6px; white-space:nowrap; }
    .item .addr { font-size:13px; font-weight:600; line-height:1.4; }
    .item .row2 { display:flex; justify-content:space-between; align-items:flex-end; margin-top:10px; }
    .item .price { color:var(--accent); font-weight:700; font-size:15px; }
    .item .meta { font-size:12px; color:var(--muted); }
    #map { flex:1 1 auto; min-width:0; background:#111827; position:relative; }
    .price-pill { transform:translate(-50%,-100%); color:#fff; font-size:12px; font-weight:700; padding:5px 10px;
      border-radius:999px; white-space:nowrap; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.4); border:2px solid #fff; position:relative; }
    .price-pill::after { content:""; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%);
      border-left:6px solid transparent; border-right:6px solid transparent; border-top:7px solid #fff; }
    .price-pill.active { transform:translate(-50%,-100%) scale(1.15); z-index:10; }
    .detail { position:absolute; left:356px; bottom:20px; width:330px; background:var(--panel);
      border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,.5);
      z-index:20; display:none; max-height:75%; overflow-y:auto; }
    .detail.show { display:block; }
    .detail .close { position:absolute; top:12px; right:14px; cursor:pointer; color:var(--muted); font-size:20px; background:none; border:none; }
    .detail h3 { font-size:15px; margin:6px 0 4px; line-height:1.45; padding-right:20px; }
    .detail .sub { font-size:12px; color:var(--muted); margin-bottom:12px; }
    .detail .row { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; gap:10px; }
    .detail .row span:first-child { color:var(--muted); white-space:nowrap; }
    .detail .row .val { text-align:right; }
    .detail .row .low { color:var(--accent); font-weight:700; }
    .detail .row .discount { color:#f87171; font-size:11px; margin-left:4px; }
    .detail .note { font-size:12px; color:var(--muted); margin-top:10px; line-height:1.5; }
    .doc-buttons { display:flex; gap:6px; margin-top:14px; flex-wrap:wrap; }
    .doc-btn { flex:1 1 auto; padding:9px 8px; font-family:inherit; font-size:12px; font-weight:600;
      color:#0f172a; background:var(--accent); border:none; border-radius:10px; cursor:pointer; text-align:center; }
    .doc-btn:hover { filter:brightness(1.08); }
    .doc-btn:disabled { opacity:.6; cursor:wait; filter:none; }
    .doc-btn.secondary { background:var(--panel2); color:var(--text); border:1px solid var(--line); }
    .doc-msg { font-size:11px; color:var(--muted); margin-top:6px; line-height:1.5; min-height:14px; }
    .rv-box { display:none; width:100%; height:220px; margin-top:10px; border-radius:12px; overflow:hidden;
      background:#111827; }
    .rv-box.show { display:block; }
    .rv-box .rv-empty { display:flex; align-items:center; justify-content:center; height:100%;
      color:var(--muted); font-size:12px; }
    .doc-modal { position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
      background:rgba(0,0,0,.6); padding:20px; }
    .doc-modal.show { display:flex; }
    .doc-modal .box { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px;
      width:100%; max-width:640px; max-height:85vh; overflow-y:auto; position:relative; }
    .doc-modal .close { position:absolute; top:14px; right:16px; cursor:pointer; color:var(--muted);
      font-size:22px; background:none; border:none; }
    .doc-modal h3 { font-size:16px; margin-bottom:14px; padding-right:24px; }
    .doc-modal table { width:100%; border-collapse:collapse; margin-bottom:14px; font-size:13px; }
    .doc-modal th, .doc-modal td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left;
      vertical-align:top; }
    .doc-modal th { color:var(--muted); font-weight:600; white-space:nowrap; width:110px; }
    .doc-modal .sec-h { font-size:13px; font-weight:700; color:var(--accent); margin:14px 0 6px; }
    .overlay-msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      background:rgba(17,24,39,.85); z-index:30; padding:30px; text-align:center; }
    .overlay-msg .box { max-width:470px; }
    .overlay-msg h2 { color:var(--accent); margin-bottom:12px; }
    .overlay-msg p { color:var(--muted); line-height:1.7; font-size:14px; }
    @media (max-width:720px) {
      .sidebar { flex-basis:100%; position:absolute; z-index:15; height:45%; bottom:0; border-right:none; border-top:1px solid var(--line); }
      .main { flex-direction:column; }
      .detail { left:12px; right:12px; width:auto; bottom:calc(45% + 12px); }
    }
  </style>
</head>
<body>
  <header>
    <h1>⚖️ 전국 <span class="dot">법원경매물건</span> 지도</h1>
    <span class="src-badge" id="srcBadge">전국 법원경매 실데이터</span>
    <select id="sidoSel"></select>
    <select id="guSel"></select>
    <div class="filters" id="filters"></div>
    <div class="filters" id="yuchalFilters"></div>
  </header>

  <div class="main">
    <aside class="sidebar">
      <div class="count" id="count">불러오는 중…</div>
      <div id="list"></div>
    </aside>
    <div id="map"></div>
  </div>

  <div class="detail" id="detail">
    <button class="close" onclick="closeDetail()">×</button>
    <div id="detailBody"></div>
  </div>

  <div class="doc-modal" id="docModal">
    <div class="box">
      <button class="close" onclick="closeDocModal()">×</button>
      <div id="docModalBody"></div>
    </div>
  </div>

  <script>
    const KAKAO_APP_KEY = "dcbb55fb29c50a738f7b5ea69c035b93";
    const CAP = 80; // 지도에 한 번에 표시할 최대 물건 수(주소변환 부담 고려)

    const 색상 = { 아파트:"#2563eb", 주택:"#0891b2", 토지:"#16a34a", 상가:"#ea580c", 기타:"#64748b" };
    const 분류목록 = ["전체","아파트","주택","상가","토지","기타"];
    const 유찰목록 = ["전체","최초","1회유찰","2회유찰","3회이상"];

    let map, places, DATA = { sido:[], guBySido:{}, items:[] }, shown = [], curSido = "", curGu = "전체", curType = "전체", curYuchal = "전체", activeIdx = -1, lastTotal = 0;

    function 분류(용도) {
      const u = 용도 || "";
      if (/아파트/.test(u)) return "아파트";
      if (/다세대|단독|연립|빌라|다가구|오피스텔|주택|도시형/.test(u)) return "주택";
      if (/상가|근린|점포|사무|공장|창고|숙박|건물/.test(u)) return "상가";
      if (/토지|대지|임야|전|답|과수|잡종|농지|도로/.test(u)) return "토지";
      return "기타";
    }
    function 유찰구분(유찰) {
      const n = 유찰 || 0;
      if (n <= 0) return "최초";
      if (n === 1) return "1회유찰";
      if (n === 2) return "2회유찰";
      return "3회이상";
    }
    function 억(원) {
      if (!원) return "-";
      if (원 >= 1e8) return (원/1e8).toFixed(1).replace(/\.0$/,"") + "억";
      if (원 >= 1e4) return Math.round(원/1e4).toLocaleString() + "만";
      return 원.toLocaleString();
    }
    function 지역라벨() { return curSido + (curGu === "전체" ? " 전체" : " " + curGu); }

    function loadKakao() {
      const s = document.createElement("script");
      s.src = "//dapi.kakao.com/v2/maps/sdk.js?appkey=" + KAKAO_APP_KEY + "&autoload=false&libraries=services";
      s.onload = () => kakao.maps.load(initMap);
      s.onerror = () => showOverlay("지도 로딩 실패", "카카오 앱 키/도메인 등록을 확인하세요.");
      document.head.appendChild(s);
    }

    async function initMap() {
      map = new kakao.maps.Map(document.getElementById("map"), { center:new kakao.maps.LatLng(37.5665,126.9780), level:8 });
      places = new kakao.maps.services.Places();
      try {
        DATA = await (await fetch("data.json")).json();
      } catch (e) { showOverlay("데이터 로딩 실패", "data.json 을 불러오지 못했습니다: " + e); return; }
      document.getElementById("srcBadge").textContent = "전국 법원경매 실데이터 " + DATA.items.length.toLocaleString() + "건";
      buildSidoSelect();
      curSido = DATA.sido[0] || "";
      document.getElementById("sidoSel").value = curSido;
      buildGuSelect();
      curGu = "전체";
      document.getElementById("guSel").value = curGu;
      apply();
    }

    function buildSidoSelect() {
      const sel = document.getElementById("sidoSel");
      sel.innerHTML = "";
      DATA.sido.forEach(s => { const o = document.createElement("option"); o.value = s; o.textContent = s; sel.appendChild(o); });
      sel.onchange = () => {
        curSido = sel.value;
        buildGuSelect();
        curGu = "전체";
        document.getElementById("guSel").value = curGu;
        activeIdx = -1; closeDetail(); apply();
      };
    }
    function buildGuSelect() {
      const sel = document.getElementById("guSel");
      sel.innerHTML = "";
      const optAll = document.createElement("option"); optAll.value = "전체"; optAll.textContent = "＋ 시/도 전체"; sel.appendChild(optAll);
      (DATA.guBySido[curSido] || []).forEach(g => { const o = document.createElement("option"); o.value = g; o.textContent = g; sel.appendChild(o); });
      sel.onchange = () => { curGu = sel.value; activeIdx = -1; closeDetail(); apply(); };
    }
    function buildFilters() {
      const box = document.getElementById("filters"); box.innerHTML = "";
      분류목록.forEach(t => {
        const b = document.createElement("button"); b.textContent = t;
        if (t === curType) { b.className = "active"; b.style.background = t === "전체" ? "var(--accent)" : (색상[t] || "var(--accent)"); }
        b.onclick = () => { curType = t; activeIdx = -1; apply(); };
        box.appendChild(b);
      });
    }
    function buildYuchalFilters() {
      const box = document.getElementById("yuchalFilters"); box.innerHTML = "";
      유찰목록.forEach(t => {
        const b = document.createElement("button"); b.textContent = t;
        if (t === curYuchal) { b.className = "active"; b.style.background = "var(--accent)"; }
        b.onclick = () => { curYuchal = t; activeIdx = -1; apply(); };
        box.appendChild(b);
      });
    }

    /* 구·용도·유찰횟수로 거른 뒤, 좌표를 아직 안 구한 물건만 주소변환 → 렌더 */
    async function apply() {
      buildFilters();
      buildYuchalFilters();
      const all = DATA.items
        .filter(it => it.시도 === curSido && (curGu === "전체" || it.시군구 === curGu))
        .map(it => { it.분류 = it.분류 || 분류(it.용도); it.유찰구분 = it.유찰구분 || 유찰구분(it.유찰); return it; })
        .filter(it => curType === "전체" || it.분류 === curType)
        .filter(it => curYuchal === "전체" || it.유찰구분 === curYuchal);
      lastTotal = all.length;
      shown = all.slice(0, CAP);
      const 표시 = lastTotal > shown.length ? lastTotal + "건 중 " + shown.length + "건" : shown.length + "건";
      document.getElementById("count").textContent = 지역라벨() + " · " + 표시 + " · 위치 찾는 중…";
      renderList();
      for (const it of shown) {
        if (it.lat == null) {
          const r = await geocodeP(it.소재지, 2);
          if (r) { it.lat = r.lat; it.lng = r.lng; }
          else it.lat = it.lat; // 못 찾으면 그대로 (마커 생략)
        }
      }
      render();
    }

    function geocodeP(query, tries) {
      return new Promise(resolve => {
        places.keywordSearch(query, (data, status) => {
          if (status === kakao.maps.services.Status.OK && data.length) { resolve({ lat:+data[0].y, lng:+data[0].x }); return; }
          const parts = query.trim().split(/\s+/);
          if (parts.length > 2 && tries > 0) geocodeP(parts.slice(0,-1).join(" "), tries-1).then(resolve);
          else resolve(null);
        });
      });
    }

    function renderList() {
      document.getElementById("count").textContent = 지역라벨() + " · " +
        (lastTotal > shown.length ? "총 " + lastTotal + "건 중 " + shown.length + "건 표시" : "총 " + shown.length + "건");
      const list = document.getElementById("list"); list.innerHTML = "";
      shown.forEach((it, i) => {
        const el = document.createElement("div");
        el.className = "item" + (i === activeIdx ? " active" : "");
        el.innerHTML =
          '<div class="top"><span class="type-tag" style="background:'+색상[it.분류]+'">'+it.분류+'</span>'+
          '<span class="meta">'+it.용도+'</span></div>'+
          '<div class="addr">'+it.소재지+'</div>'+
          '<div class="row2"><span class="price">'+억(it.최저가)+' <span class="meta">('+it.최저가율+'%)</span></span>'+
          '<span class="meta">'+it.유찰구분+' · '+it.매각기일+'</span></div>';
        el.onclick = () => selectItem(i);
        list.appendChild(el);
      });
    }

    function render() {
      renderList();
      clearOverlays();
      if (!map) return;
      const bounds = new kakao.maps.LatLngBounds(); let placed = 0;
      shown.forEach((it, i) => {
        if (it.lat == null) return;
        const pill = document.createElement("div");
        pill.className = "price-pill" + (i === activeIdx ? " active" : "");
        pill.style.background = 색상[it.분류];
        pill.textContent = 억(it.최저가);
        pill.onclick = () => selectItem(i);
        const pos = new kakao.maps.LatLng(it.lat, it.lng);
        const ov = new kakao.maps.CustomOverlay({ position: pos, content: pill, yAnchor: 1 });
        ov.setMap(map); overlays.push(ov); bounds.extend(pos); placed++;
      });
      if (placed && activeIdx < 0) map.setBounds(bounds);
    }

    let overlays = [];
    function clearOverlays() { overlays.forEach(o => o.setMap(null)); overlays = []; }

    function selectItem(i) {
      activeIdx = i;
      const it = shown[i];
      if (map && it.lat != null) map.panTo(new kakao.maps.LatLng(it.lat, it.lng));
      showDetail(it); render();
    }

    function showDetail(it) {
      curDetailItem = it;
      const 저감 = it.감정가 ? Math.round((1 - it.최저가/it.감정가) * 100) : 0;
      document.getElementById("detailBody").innerHTML =
        '<span class="type-tag" style="background:'+색상[it.분류]+'">'+it.분류+'</span>'+
        '<h3>'+it.소재지+'</h3>'+
        '<div class="sub">'+it.법원+' · '+it.사건번호+'</div>'+
        '<div class="row"><span>용도</span><span class="val">'+it.용도+'</span></div>'+
        '<div class="row"><span>감정가</span><span class="val">'+억(it.감정가)+'</span></div>'+
        '<div class="row"><span>최저매각가</span><span class="val low">'+억(it.최저가)+
          '<span class="discount">'+it.최저가율+'%</span></span></div>'+
        '<div class="row"><span>유찰</span><span class="val">'+it.유찰구분+' ('+it.유찰+'회)</span></div>'+
        '<div class="row"><span>매각기일</span><span class="val">'+it.매각기일+'</span></div>'+
        (it.면적구조 ? '<div class="note">📐 '+it.면적구조+'</div>' : '')+
        (it.비고 ? '<div class="note">📌 '+it.비고+'</div>' : '')+
        '<button class="doc-btn secondary" style="margin-top:14px;width:100%" onclick="toggleRoadview()">🚶 로드뷰 보기</button>'+
        '<div class="rv-box" id="rvBox"></div>'+
        '<div class="doc-buttons">'+
          '<button class="doc-btn" id="docBtn_maegak" onclick="openDoc(\'maegak\')">매각물건명세서</button>'+
          '<button class="doc-btn" id="docBtn_curst" onclick="openDoc(\'curst\')">현황조사서</button>'+
          '<button class="doc-btn" id="docBtn_aee" onclick="openDoc(\'aee\')">감정평가서</button>'+
        '</div>'+
        '<div class="doc-msg" id="docMsg"></div>';
      document.getElementById("detail").classList.add("show");
    }
    function closeDetail() {
      document.getElementById("detail").classList.remove("show");
      activeIdx = -1;
      destroyRoadview();
    }

    let curDetailItem = null;

    /* ---------- 카카오 로드뷰 ---------- */
    let rvInstance = null;
    function destroyRoadview() { rvInstance = null; }
    function toggleRoadview() {
      const box = document.getElementById("rvBox");
      if (!box) return;
      if (box.classList.contains("show")) { box.classList.remove("show"); box.innerHTML = ""; rvInstance = null; return; }
      const it = curDetailItem;
      if (!it || it.lat == null) { window.alert("이 물건의 위치 좌표를 아직 찾지 못했습니다."); return; }
      box.classList.add("show");
      box.innerHTML = "";
      const rvClient = new kakao.maps.RoadviewClient();
      const position = new kakao.maps.LatLng(it.lat, it.lng);
      rvClient.getNearestPanoId(position, 50, (panoId) => {
        if (panoId == null) {
          box.innerHTML = '<div class="rv-empty">이 주변에는 로드뷰가 없습니다.</div>';
          return;
        }
        rvInstance = new kakao.maps.Roadview(box);
        rvInstance.setPanoId(panoId, position);
      });
    }

    /* ---------- 매각물건명세서 · 현황조사서 · 감정평가서 ---------- */
    async function openDoc(type) {
      const it = curDetailItem;
      const msg = document.getElementById("docMsg");
      const btn = document.getElementById("docBtn_" + type);
      if (!it) return;
      if (!it.cortOfcCd || !it.saNo) {
        msg.textContent = "이 물건은 문서 조회에 필요한 사건 식별정보가 없습니다.";
        return;
      }
      msg.textContent = "";
      btn.disabled = true;
      const prevText = btn.textContent;
      btn.textContent = "조회 중…";
      try {
        const params = new URLSearchParams({
          type,
          cortOfcCd: it.cortOfcCd,
          saNo: it.saNo,
          csNo: it.사건번호,
          dspslGdsSeq: it.dspslGdsSeq || "1",
          maeGiil: it.매각기일 || "",
          cortNm: it.법원 || "",
        });
        const res = await fetch("/api/docs?" + params.toString());
        const json = await res.json();
        if (!res.ok || json.error) {
          msg.textContent = json.error || "문서를 불러오지 못했습니다.";
          return;
        }
        if (type === "curst") {
          renderCurstModal(json.data, it);
        } else {
          window.open(json.url, "_blank", "noopener");
        }
      } catch (e) {
        msg.textContent = "요청 중 오류가 발생했습니다: " + e;
      } finally {
        btn.disabled = false;
        btn.textContent = prevText;
      }
    }

    function renderCurstModal(data, it) {
      const info = data?.dma_curstExmnMngInf || {};
      const objs = data?.dlt_ordTsRlet || [];
      const lsers = data?.dlt_ordTsLserLtn || [];
      let html = '<h3>현황조사서 · ' + (it.사건번호 || "") + '</h3>';
      html += '<div class="sec-h">기본정보</div>';
      html += '<table><tr><th>조사일시</th><td>' + (info.exmnDtDts || "-") + '</td></tr></table>';
      html += '<div class="sec-h">부동산의 현황 및 점유관계</div>';
      html += '<table>';
      objs.forEach(o => {
        html += '<tr><th>소재지</th><td>' + (o.printSt || "") + '</td></tr>';
        html += '<tr><th>점유관계</th><td>' + (o.auctnPossRltnCd === "02" ? "임차인(별지)점유" : (o.auctnPossRltnCd || "-")) + '</td></tr>';
        html += '<tr><th>현황</th><td>' + (o.gdsPossCtt || "-").replace(/<br\s*\/?>/g, "<br>") + '</td></tr>';
      });
      html += '</table>';
      if (lsers.length) {
        html += '<div class="sec-h">임대차관계 조사서</div><table>';
        lsers.forEach(l => {
          html += '<tr><th>점유인</th><td>' + (l.intrpsNm || "-") + '</td></tr>';
          html += '<tr><th>전입일자</th><td>' + (l.mvinDtlCtt || "-") + '</td></tr>';
        });
        html += '</table>';
      }
      document.getElementById("docModalBody").innerHTML = html;
      document.getElementById("docModal").classList.add("show");
    }
    function closeDocModal() { document.getElementById("docModal").classList.remove("show"); }

    function showOverlay(title, msg) {
      const g = document.createElement("div"); g.className = "overlay-msg";
      g.innerHTML = '<div class="box"><h2>'+title+'</h2><p>'+msg+'</p></div>';
      document.getElementById("map").appendChild(g);
    }

    loadKakao();
  </script>
</body>
</html>
