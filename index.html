<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전국 아파트 실거래가 지도</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --panel2: #273449;
      --line: rgba(148,163,184,0.18); --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", -apple-system, "Malgun Gothic", sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }
    header {
      flex: 0 0 auto; padding: 12px 20px; background: var(--panel);
      border-bottom: 1px solid var(--line); display: flex; align-items: center;
      gap: 14px; flex-wrap: wrap;
    }
    header h1 { font-size: 17px; white-space: nowrap; }
    header h1 .dot { color: var(--accent); }
    .src-badge {
      font-size: 11px; color: #34d399; background: rgba(52,211,153,0.12);
      border: 1px solid rgba(52,211,153,0.3); padding: 3px 10px; border-radius: 999px; white-space: nowrap;
    }
    .controls { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
    select {
      font-family: inherit; font-size: 13px; color: var(--text);
      background: var(--panel2); border: 1px solid var(--line);
      padding: 7px 12px; border-radius: 8px; cursor: pointer;
    }
    .main { flex: 1 1 auto; display: flex; min-height: 0; }
    .sidebar {
      flex: 0 0 340px; background: var(--panel); border-right: 1px solid var(--line);
      overflow-y: auto; padding: 12px;
    }
    .count { font-size: 13px; color: var(--muted); padding: 4px 6px 12px; }
    .item {
      background: var(--panel2); border: 1px solid var(--line); border-radius: 12px;
      padding: 14px; margin-bottom: 10px; cursor: pointer; transition: all 0.15s;
    }
    .item:hover { border-color: var(--accent); transform: translateY(-1px); }
    .item.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56,189,248,0.3); }
    .item .name { font-size: 14px; font-weight: 700; line-height: 1.4; }
    .item .dong { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .item .row2 { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; }
    .item .price { color: var(--accent); font-weight: 700; font-size: 15px; }
    .item .spec { font-size: 12px; color: var(--muted); }
    #map { flex: 1 1 auto; min-width: 0; background: #111827; position: relative; }
    .price-pill {
      transform: translate(-50%, -100%); background: #2563eb; color: #fff; font-size: 12px;
      font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4); border: 2px solid #fff; position: relative;
    }
    .price-pill::after {
      content: ""; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%);
      border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid #fff;
    }
    .price-pill.active { transform: translate(-50%,-100%) scale(1.15); z-index: 10; background: #38bdf8; color: #0f172a; }
    .detail {
      position: absolute; left: 356px; bottom: 20px; width: 320px; background: var(--panel);
      border: 1px solid var(--line); border-radius: 16px; padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5); z-index: 20; display: none; max-height: 70%; overflow-y: auto;
    }
    .detail.show { display: block; }
    .detail .close { position: absolute; top: 12px; right: 14px; cursor: pointer; color: var(--muted); font-size: 20px; background: none; border: none; }
    .detail h3 { font-size: 16px; margin: 4px 0 2px; line-height: 1.4; padding-right: 20px; }
    .detail .dong { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .detail .deal { border-top: 1px solid var(--line); padding: 8px 0; font-size: 13px; display: flex; justify-content: space-between; }
    .detail .deal .p { color: var(--accent); font-weight: 700; }
    .overlay-msg {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(17,24,39,0.85); z-index: 30; padding: 30px; text-align: center;
    }
    .overlay-msg .box { max-width: 460px; }
    .overlay-msg h2 { color: var(--accent); margin-bottom: 12px; }
    .overlay-msg p { color: var(--muted); line-height: 1.7; font-size: 14px; }
    .overlay-msg code { background: var(--panel2); padding: 2px 6px; border-radius: 4px; color: #fbbf24; }
    @media (max-width: 720px) {
      .sidebar { flex-basis: 100%; position: absolute; z-index: 15; height: 45%; bottom: 0; border-right: none; border-top: 1px solid var(--line); }
      .main { flex-direction: column; }
      .detail { left: 12px; right: 12px; width: auto; bottom: calc(45% + 12px); }
    }
  </style>
</head>
<body>
  <header>
    <h1>🏢 전국 아파트 <span class="dot">실거래가</span> 지도</h1>
    <span class="src-badge">국토교통부 공식 실거래가</span>
    <div class="controls">
      <select id="regionSel"></select>
      <select id="monthSel"></select>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar">
      <div class="count" id="count">준비 중…</div>
      <div id="list"></div>
    </aside>
    <div id="map"></div>
  </div>

  <div class="detail" id="detail">
    <button class="close" onclick="closeDetail()">×</button>
    <div id="detailBody"></div>
  </div>

  <script>
    /* 카카오맵 JavaScript 키 (공개키 — 도메인 등록으로 보호됨) */
    const KAKAO_APP_KEY = "dcbb55fb29c50a738f7b5ea69c035b93";

    /* 지원 지역: name=표시명, lawd=지역코드(법정동5자리), geo=주소검색용 접두어 */
    const 지역들 = [
      { name:"서울 강남구",   lawd:"11680", geo:"서울 강남구" },
      { name:"서울 서초구",   lawd:"11650", geo:"서울 서초구" },
      { name:"서울 송파구",   lawd:"11710", geo:"서울 송파구" },
      { name:"서울 마포구",   lawd:"11440", geo:"서울 마포구" },
      { name:"서울 노원구",   lawd:"11350", geo:"서울 노원구" },
      { name:"성남 분당구",   lawd:"41135", geo:"경기 성남시 분당구" },
      { name:"인천 연수구",   lawd:"28185", geo:"인천 연수구" },
      { name:"부산 해운대구", lawd:"26350", geo:"부산 해운대구" },
      { name:"대구 수성구",   lawd:"27260", geo:"대구 수성구" },
      { name:"대전 유성구",   lawd:"30200", geo:"대전 유성구" },
    ];

    let map, places, overlays = [], deals = [], buildings = [], activeKey = null;

    /* 만원 → "12.5억" / "3,200만" */
    function 억(만원) {
      if (!만원) return "-";
      if (만원 >= 10000) return (만원/10000).toFixed(1).replace(/\.0$/,"") + "억";
      return 만원.toLocaleString() + "만";
    }
    function 건물키(d) { return d.법정동 + "|" + d.아파트; }

    /* ---- 카카오맵 로딩 ---- */
    function loadKakao() {
      if (KAKAO_APP_KEY.includes("여기에")) return;
      const s = document.createElement("script");
      s.src = "//dapi.kakao.com/v2/maps/sdk.js?appkey=" + KAKAO_APP_KEY + "&autoload=false&libraries=services";
      s.onload = () => kakao.maps.load(initMap);
      s.onerror = () => showOverlay("지도 로딩 실패", "카카오 앱 키 또는 도메인 등록을 확인하세요.");
      document.head.appendChild(s);
    }
    function initMap() {
      map = new kakao.maps.Map(document.getElementById("map"), {
        center: new kakao.maps.LatLng(36.4, 127.8), level: 13
      });
      places = new kakao.maps.services.Places();
      buildControls();
      load();
    }

    /* ---- 지역/월 선택 UI ---- */
    function buildControls() {
      const rs = document.getElementById("regionSel");
      지역들.forEach((r, i) => { const o = document.createElement("option"); o.value = i; o.textContent = r.name; rs.appendChild(o); });
      rs.onchange = load;
      const ms = document.getElementById("monthSel");
      const now = new Date(); // 최근 12개월(전월부터)
      for (let i = 1; i <= 12; i++) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const ym = d.getFullYear() + String(d.getMonth()+1).padStart(2,"0");
        const o = document.createElement("option"); o.value = ym;
        o.textContent = d.getFullYear() + "년 " + (d.getMonth()+1) + "월"; ms.appendChild(o);
      }
      ms.selectedIndex = 1; // 두 달 전(데이터 안정적으로 있는 시점)
      ms.onchange = load;
    }

    /* ---- 데이터 불러오기 ---- */
    async function load() {
      const region = 지역들[+document.getElementById("regionSel").value];
      const ymd = document.getElementById("monthSel").value;
      document.getElementById("count").textContent = "불러오는 중…";
      document.getElementById("list").innerHTML = "";
      clearOverlays();
      closeDetail();
      hideOverlay();

      let json;
      try { json = await (await fetch("/api/deals?lawd=" + region.lawd + "&ymd=" + ymd)).json(); }
      catch (e) { showOverlay("불러오기 실패", "서버 함수 호출에 실패했습니다: " + e); return; }

      if (json.error === "NO_KEY") {
        showOverlay("🔑 API 키 설정이 필요해요",
          "Vercel 환경변수 <code>DATA_GO_KR_KEY</code> 에 공공데이터포털 인증키를 등록한 뒤 재배포하면 실제 실거래가가 표시됩니다.");
        document.getElementById("count").textContent = "API 키 필요";
        return;
      }
      if (json.error) {
        showOverlay("데이터 오류", (json.message || json.error));
        document.getElementById("count").textContent = "오류";
        return;
      }

      deals = json.items || [];
      if (!deals.length) {
        document.getElementById("count").textContent = "이 지역·월의 거래가 없습니다. 다른 월을 선택해 보세요.";
        return;
      }

      // 건물(아파트) 단위로 묶기
      const map1 = new Map();
      deals.forEach(d => {
        const k = 건물키(d);
        if (!map1.has(k)) map1.set(k, { key:k, 아파트:d.아파트, 법정동:d.법정동, region, deals:[] });
        map1.get(k).deals.push(d);
      });
      buildings = [...map1.values()];
      document.getElementById("count").textContent = "총 " + deals.length + "건 · 아파트 " + buildings.length + "곳 · 위치 찾는 중…";

      // 건물별 주소 → 좌표
      for (const b of buildings) {
        if (b.lat != null) continue;
        const r = await geocodeP(b.region.geo + " " + b.법정동 + " " + b.아파트, 2);
        if (r) { b.lat = r.lat; b.lng = r.lng; }
      }
      render();
    }

    /* 주소 → 좌표 (Promise, 못 찾으면 뒤 단어 떼며 재시도) */
    function geocodeP(query, tries) {
      return new Promise(resolve => {
        places.keywordSearch(query, (data, status) => {
          if (status === kakao.maps.services.Status.OK && data.length) {
            resolve({ lat:+data[0].y, lng:+data[0].x }); return;
          }
          const parts = query.trim().split(/\s+/);
          if (parts.length > 2 && tries > 0) geocodeP(parts.slice(0,-1).join(" "), tries-1).then(resolve);
          else resolve(null);
        });
      });
    }

    /* ---- 화면 그리기 ---- */
    function render() {
      const region = 지역들[+document.getElementById("regionSel").value];
      document.getElementById("count").textContent = "총 " + deals.length + "건 · 아파트 " + buildings.length + "곳";

      // 목록: 거래 건별(최신순)
      const sorted = [...deals].sort((a,b) => (b.년+b.월.padStart(2,"0")+b.일.padStart(2,"0")) - (a.년+a.월.padStart(2,"0")+a.일.padStart(2,"0")));
      const list = document.getElementById("list");
      list.innerHTML = "";
      sorted.forEach(d => {
        const k = 건물키(d);
        const el = document.createElement("div");
        el.className = "item" + (k === activeKey ? " active" : "");
        el.innerHTML =
          '<div class="name">' + d.아파트 + '</div>' +
          '<div class="dong">' + region.name + ' ' + d.법정동 + '</div>' +
          '<div class="row2"><span class="price">' + 억(d.거래금액) + '</span>' +
          '<span class="spec">전용 ' + d.전용면적 + '㎡ · ' + d.층 + '층 · ' + d.월 + '/' + d.일 + '</span></div>';
        el.onclick = () => selectBuilding(k);
        list.appendChild(el);
      });

      // 지도 마커: 건물 단위
      clearOverlays();
      if (!map) return;
      const bounds = new kakao.maps.LatLngBounds();
      let placed = 0;
      buildings.forEach(b => {
        if (b.lat == null) return;
        const maxPrice = Math.max(...b.deals.map(d => d.거래금액));
        const pill = document.createElement("div");
        pill.className = "price-pill" + (b.key === activeKey ? " active" : "");
        pill.textContent = 억(maxPrice) + (b.deals.length > 1 ? " ·" + b.deals.length : "");
        pill.onclick = () => selectBuilding(b.key);
        const pos = new kakao.maps.LatLng(b.lat, b.lng);
        const ov = new kakao.maps.CustomOverlay({ position: pos, content: pill, yAnchor: 1 });
        ov.setMap(map);
        overlays.push(ov);
        bounds.extend(pos); placed++;
      });
      if (placed && !activeKey) map.setBounds(bounds);
    }

    function selectBuilding(key) {
      activeKey = key;
      const b = buildings.find(x => x.key === key);
      if (b && map && b.lat != null) map.panTo(new kakao.maps.LatLng(b.lat, b.lng));
      if (b) showDetail(b);
      render();
    }

    function showDetail(b) {
      const region = b.region;
      const ds = [...b.deals].sort((a,c) => c.거래금액 - a.거래금액);
      let html = '<h3>' + b.아파트 + '</h3><div class="dong">' + region.name + ' ' + b.법정동 + ' · 거래 ' + b.deals.length + '건</div>';
      ds.forEach(d => {
        html += '<div class="deal"><span>전용 ' + d.전용면적 + '㎡ · ' + d.층 + '층 · ' + d.건축년도 + '년</span>' +
                '<span class="p">' + 억(d.거래금액) + '</span></div>';
      });
      document.getElementById("detailBody").innerHTML = html;
      document.getElementById("detail").classList.add("show");
    }
    function closeDetail() {
      document.getElementById("detail").classList.remove("show");
      activeKey = null;
    }

    /* ---- 유틸 ---- */
    function clearOverlays() { overlays.forEach(o => o.setMap(null)); overlays = []; }
    function showOverlay(title, msg) {
      hideOverlay();
      const g = document.createElement("div");
      g.className = "overlay-msg"; g.id = "overlayMsg";
      g.innerHTML = '<div class="box"><h2>' + title + '</h2><p>' + msg + '</p></div>';
      document.getElementById("map").appendChild(g);
    }
    function hideOverlay() { document.getElementById("overlayMsg")?.remove(); }

    /* ---- 시작 ---- */
    loadKakao();
  </script>
</body>
</html>
