<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전국 경매물건 지도</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel2: #273449;
      --line: rgba(148,163,184,0.18);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", -apple-system, "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    /* 상단 헤더 */
    header {
      flex: 0 0 auto;
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 18px; white-space: nowrap; }
    header h1 .dot { color: var(--accent); }
    .sample-badge {
      font-size: 11px; color: #fbbf24;
      background: rgba(251,191,36,0.12);
      border: 1px solid rgba(251,191,36,0.3);
      padding: 3px 10px; border-radius: 999px; white-space: nowrap;
    }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
    .filters button {
      font-family: inherit; font-size: 13px; cursor: pointer;
      color: var(--muted); background: var(--panel2);
      border: 1px solid var(--line); padding: 6px 14px; border-radius: 999px;
      transition: all 0.15s;
    }
    .filters button:hover { color: var(--text); }
    .filters button.active { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 600; }

    /* 본문: 목록 + 지도 */
    .main { flex: 1 1 auto; display: flex; min-height: 0; }
    .sidebar {
      flex: 0 0 340px; background: var(--panel);
      border-right: 1px solid var(--line);
      overflow-y: auto; padding: 12px;
    }
    .count { font-size: 13px; color: var(--muted); padding: 4px 6px 12px; }
    .item {
      background: var(--panel2); border: 1px solid var(--line);
      border-radius: 12px; padding: 14px; margin-bottom: 10px; cursor: pointer;
      transition: all 0.15s;
    }
    .item:hover { border-color: var(--accent); transform: translateY(-1px); }
    .item.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56,189,248,0.3); }
    .item .top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .type-tag { font-size: 11px; font-weight: 700; color: #fff; padding: 2px 8px; border-radius: 6px; }
    .item .addr { font-size: 14px; font-weight: 600; line-height: 1.4; }
    .item .prices { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; }
    .item .prices .low { color: var(--accent); font-weight: 700; }
    .item .meta { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; }

    #map { flex: 1 1 auto; min-width: 0; background: #111827; position: relative; }

    /* 지도 위 가격 마커 */
    .price-pill {
      transform: translate(-50%, -100%);
      background: #2563eb; color: #fff; font-size: 12px; font-weight: 700;
      padding: 5px 10px; border-radius: 999px; white-space: nowrap; cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4); border: 2px solid #fff;
      position: relative;
    }
    .price-pill::after {
      content: ""; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%);
      border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid #fff;
    }
    .price-pill.active { transform: translate(-50%,-100%) scale(1.15); z-index: 10; }

    /* 상세 카드 */
    .detail {
      position: absolute; left: 356px; bottom: 20px; width: 320px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); z-index: 20; display: none;
    }
    .detail.show { display: block; }
    .detail .close { position: absolute; top: 12px; right: 14px; cursor: pointer; color: var(--muted); font-size: 20px; background: none; border: none; }
    .detail h3 { font-size: 16px; margin: 8px 0 4px; line-height: 1.4; padding-right: 20px; }
    .detail .rows { margin-top: 14px; }
    .detail .row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .detail .row span:first-child { color: var(--muted); }
    .detail .row .low { color: var(--accent); font-weight: 700; }
    .detail .row .discount { color: #f87171; font-size: 11px; margin-left: 4px; }

    /* 키 없을 때 안내 */
    .keyguide {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #111827; z-index: 30; padding: 30px; text-align: center;
    }
    .keyguide .box { max-width: 460px; }
    .keyguide h2 { color: var(--accent); margin-bottom: 12px; }
    .keyguide p { color: var(--muted); line-height: 1.7; font-size: 14px; }
    .keyguide code { background: var(--panel2); padding: 2px 6px; border-radius: 4px; color: #fbbf24; }

    @media (max-width: 720px) {
      .sidebar { flex-basis: 100%; position: absolute; z-index: 15; height: 45%; bottom: 0; border-right: none; border-top: 1px solid var(--line); }
      .main { flex-direction: column; }
      .detail { left: 12px; right: 12px; width: auto; bottom: calc(45% + 12px); }
    }
  </style>
</head>
<body>
  <header>
    <h1>🏠 전국 경매물건 <span class="dot">지도</span></h1>
    <span class="sample-badge">샘플 데이터</span>
    <div class="filters" id="filters"></div>
  </header>

  <div class="main">
    <aside class="sidebar">
      <div class="count" id="count"></div>
      <div id="list"></div>
    </aside>
    <div id="map"></div>
  </div>

  <div class="detail" id="detail">
    <button class="close" onclick="closeDetail()">×</button>
    <div id="detailBody"></div>
  </div>

  <script>
    /* =========================================================
       ① 카카오맵 앱 키 — 아래 따옴표 안에 발급받은 JavaScript 키를 넣으세요
       ========================================================= */
    const KAKAO_APP_KEY = "dcbb55fb29c50a738f7b5ea69c035b93";

    /* =========================================================
       ② 경매 물건 샘플 데이터
          - 나중에 실제 물건을 추가하려면 이 배열에 항목을 넣으면 됩니다.
          - 금액 단위: 만원
       ========================================================= */
    const 물건목록 = [
      { 종류:"아파트",   주소:"서울 강남구 대치동 은마아파트",     감정가:180000, 최저가:144000, 유찰:1, 매각기일:"2026-10-14", 법원:"서울중앙지방법원", 사건번호:"2025타경12345", lat:37.4996, lng:127.0629 },
      { 종류:"아파트",   주소:"서울 서초구 반포동 래미안퍼스티지", 감정가:320000, 최저가:256000, 유찰:1, 매각기일:"2026-10-21", 법원:"서울중앙지방법원", 사건번호:"2025타경23456", lat:37.5045, lng:127.0110 },
      { 종류:"아파트",   주소:"서울 송파구 잠실동 리센츠",         감정가:240000, 최저가:192000, 유찰:1, 매각기일:"2026-10-28", 법원:"서울동부지방법원", 사건번호:"2025타경34567", lat:37.5133, lng:127.1000 },
      { 종류:"오피스텔", 주소:"서울 마포구 상암동 DMC오피스텔",   감정가:38000,  최저가:24320,  유찰:2, 매각기일:"2026-11-04", 법원:"서울서부지방법원", 사건번호:"2025타경45678", lat:37.5794, lng:126.8895 },
      { 종류:"다세대",   주소:"서울 강서구 화곡동 다세대주택",     감정가:29000,  최저가:23200,  유찰:1, 매각기일:"2026-11-11", 법원:"서울남부지방법원", 사건번호:"2025타경56789", lat:37.5416, lng:126.8407 },
      { 종류:"아파트",   주소:"인천 연수구 송도동 더샵센트럴파크", 감정가:95000,  최저가:76000,  유찰:1, 매각기일:"2026-10-16", 법원:"인천지방법원",     사건번호:"2025타경11223", lat:37.3894, lng:126.6390 },
      { 종류:"아파트",   주소:"경기 성남시 분당구 정자동 파크뷰",  감정가:155000, 최저가:124000, 유찰:1, 매각기일:"2026-10-23", 법원:"수원지방법원 성남지원", 사건번호:"2025타경22334", lat:37.3660, lng:127.1080 },
      { 종류:"상가",     주소:"경기 수원시 영통구 근린상가",       감정가:62000,  최저가:39680,  유찰:2, 매각기일:"2026-11-06", 법원:"수원지방법원",     사건번호:"2025타경33445", lat:37.2596, lng:127.0466 },
      { 종류:"아파트",   주소:"경기 고양시 일산동구 위시티자이",   감정가:78000,  최저가:62400,  유찰:1, 매각기일:"2026-10-30", 법원:"의정부지방법원 고양지원", 사건번호:"2025타경44556", lat:37.6584, lng:126.7770 },
      { 종류:"아파트",   주소:"부산 해운대구 우동 마린시티자이",   감정가:135000, 최저가:108000, 유찰:1, 매각기일:"2026-10-17", 법원:"부산지방법원",     사건번호:"2025타경55667", lat:35.1631, lng:129.1637 },
      { 종류:"상가",     주소:"부산 부산진구 부전동 상가",         감정가:48000,  최저가:30720,  유찰:2, 매각기일:"2026-11-13", 법원:"부산지방법원",     사건번호:"2025타경66778", lat:35.1626, lng:129.0530 },
      { 종류:"아파트",   주소:"대구 수성구 범어동 두산위브",       감정가:88000,  최저가:70400,  유찰:1, 매각기일:"2026-10-20", 법원:"대구지방법원",     사건번호:"2025타경77889", lat:35.8580, lng:128.6300 },
      { 종류:"토지",     주소:"대전 유성구 관평동 대지 330㎡",     감정가:52000,  최저가:41600,  유찰:1, 매각기일:"2026-11-02", 법원:"대전지방법원",     사건번호:"2025타경88990", lat:36.3620, lng:127.3560 },
      { 종류:"오피스텔", 주소:"광주 서구 치평동 오피스텔",         감정가:31000,  최저가:24800,  유찰:1, 매각기일:"2026-10-27", 법원:"광주지방법원",     사건번호:"2025타경99001", lat:35.1520, lng:126.8900 },
      { 종류:"아파트",   주소:"울산 남구 삼산동 대현더샵",         감정가:64000,  최저가:51200,  유찰:1, 매각기일:"2026-10-19", 법원:"울산지방법원",     사건번호:"2025타경10112", lat:35.5384, lng:129.3114 },
      { 종류:"토지",     주소:"제주 제주시 애월읍 임야",           감정가:41000,  최저가:20090,  유찰:3, 매각기일:"2026-11-09", 법원:"제주지방법원",     사건번호:"2025타경12131", lat:33.4996, lng:126.5312 },
      { 종류:"아파트",   주소:"강원 춘천시 온의동 롯데캐슬",       감정가:47000,  최저가:37600,  유찰:1, 매각기일:"2026-10-25", 법원:"춘천지방법원",     사건번호:"2025타경14151", lat:37.8813, lng:127.7298 },
      { 종류:"상가",     주소:"충북 청주시 흥덕구 근린상가",       감정가:56000,  최저가:35840,  유찰:2, 매각기일:"2026-11-07", 법원:"청주지방법원",     사건번호:"2025타경16171", lat:36.6424, lng:127.4890 },
    ];

    /* 종류별 색상 */
    const 색상 = { "아파트":"#2563eb", "오피스텔":"#7c3aed", "다세대":"#0891b2", "상가":"#ea580c", "토지":"#16a34a" };
    const 종류들 = ["전체", ...Object.keys(색상)];

    let map, overlays = [], currentFilter = "전체", activeIndex = -1;

    /* 금액 포맷: 만원 → "12.5억" 또는 "3,200만" */
    function 억(만원) {
      if (만원 >= 10000) return (만원/10000).toFixed(1).replace(/\.0$/,"") + "억";
      return 만원.toLocaleString() + "만";
    }

    /* ---------- 카카오맵 로딩 ---------- */
    function loadKakao() {
      if (KAKAO_APP_KEY.includes("여기에")) { return; } // 키 아직 없음 → 안내 화면 유지
      const s = document.createElement("script");
      s.src = "//dapi.kakao.com/v2/maps/sdk.js?appkey=" + KAKAO_APP_KEY + "&autoload=false";
      s.onload = () => kakao.maps.load(initMap);
      s.onerror = () => alert("카카오맵 로딩 실패: 앱 키 또는 도메인 등록을 확인하세요.");
      document.head.appendChild(s);
    }

    function initMap() {
      document.getElementById("keyguideEl")?.remove();
      map = new kakao.maps.Map(document.getElementById("map"), {
        center: new kakao.maps.LatLng(36.4, 127.8), // 대한민국 중심
        level: 13
      });
      render();
    }

    /* ---------- 필터 버튼 ---------- */
    function buildFilters() {
      const box = document.getElementById("filters");
      box.innerHTML = "";
      종류들.forEach(t => {
        const b = document.createElement("button");
        b.textContent = t;
        if (t === currentFilter) b.className = "active";
        b.onclick = () => { currentFilter = t; render(); };
        box.appendChild(b);
      });
    }

    /* ---------- 목록 + 지도 마커 그리기 ---------- */
    function render() {
      buildFilters();
      const items = 물건목록
        .map((d, i) => ({ ...d, _i: i }))
        .filter(d => currentFilter === "전체" || d.종류 === currentFilter);

      // 목록
      document.getElementById("count").textContent = "총 " + items.length + "건";
      const list = document.getElementById("list");
      list.innerHTML = "";
      items.forEach(d => {
        const 할인 = Math.round((1 - d.최저가/d.감정가) * 100);
        const el = document.createElement("div");
        el.className = "item" + (d._i === activeIndex ? " active" : "");
        el.innerHTML =
          '<div class="top"><span class="type-tag" style="background:'+색상[d.종류]+'">'+d.종류+'</span></div>' +
          '<div class="addr">'+d.주소+'</div>' +
          '<div class="prices"><span>감정 '+억(d.감정가)+'</span><span class="low">최저 '+억(d.최저가)+' ('+할인+'%↓)</span></div>' +
          '<div class="meta"><span>유찰 '+d.유찰+'회</span><span>매각 '+d.매각기일+'</span></div>';
        el.onclick = () => selectItem(d._i);
        list.appendChild(el);
      });

      // 지도 마커 (카카오맵 로드된 경우만)
      if (!map) return;
      overlays.forEach(o => o.setMap(null));
      overlays = [];
      items.forEach(d => {
        const pill = document.createElement("div");
        pill.className = "price-pill";
        pill.style.background = 색상[d.종류];
        pill.textContent = 억(d.최저가);
        pill.onclick = () => selectItem(d._i);
        const ov = new kakao.maps.CustomOverlay({
          position: new kakao.maps.LatLng(d.lat, d.lng),
          content: pill, yAnchor: 1
        });
        ov.setMap(map);
        overlays.push({ setMap: (m)=>ov.setMap(m), el: pill, i: d._i });
      });
    }

    /* ---------- 물건 선택 ---------- */
    function selectItem(i) {
      activeIndex = i;
      const d = 물건목록[i];
      if (map) map.panTo(new kakao.maps.LatLng(d.lat, d.lng));
      showDetail(d);
      render();
    }

    function showDetail(d) {
      const 할인 = Math.round((1 - d.최저가/d.감정가) * 100);
      document.getElementById("detailBody").innerHTML =
        '<span class="type-tag" style="background:'+색상[d.종류]+'">'+d.종류+'</span>' +
        '<h3>'+d.주소+'</h3>' +
        '<div class="rows">' +
        '<div class="row"><span>감정가</span><span>'+억(d.감정가)+'</span></div>' +
        '<div class="row"><span>최저가</span><span class="low">'+억(d.최저가)+'<span class="discount">'+할인+'% 저감</span></span></div>' +
        '<div class="row"><span>유찰</span><span>'+d.유찰+'회</span></div>' +
        '<div class="row"><span>매각기일</span><span>'+d.매각기일+'</span></div>' +
        '<div class="row"><span>법원</span><span>'+d.법원+'</span></div>' +
        '<div class="row"><span>사건번호</span><span>'+d.사건번호+'</span></div>' +
        '</div>';
      document.getElementById("detail").classList.add("show");
    }
    function closeDetail() {
      document.getElementById("detail").classList.remove("show");
      activeIndex = -1; render();
    }

    /* ---------- 시작 ---------- */
    buildFilters();
    render(); // 목록은 키 없어도 먼저 보임
    if (KAKAO_APP_KEY.includes("여기에")) {
      const g = document.createElement("div");
      g.className = "keyguide"; g.id = "keyguideEl";
      g.innerHTML = '<div class="box"><h2>🔑 카카오맵 키가 필요해요</h2>' +
        '<p>코드의 <code>KAKAO_APP_KEY</code> 자리에 카카오 개발자센터에서 발급받은 ' +
        '<b>JavaScript 키</b>를 넣으면 지도가 나타납니다.<br><br>' +
        '(왼쪽 물건 목록은 키 없이도 잘 보입니다 👍)</p></div>';
      document.getElementById("map").appendChild(g);
    } else {
      loadKakao();
    }
  </script>
</body>
</html>
