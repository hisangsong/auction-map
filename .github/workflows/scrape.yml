name: 법원경매물건 데이터 자동 갱신

on:
  schedule:
    # 한국 공공사이트(courtauction·data.go.kr)가 GitHub 해외 IP를 간헐 차단해
    # 특정 회차가 연결 타임아웃으로 실패할 수 있다 → 하루 3회 시도(실패 대비).
    # 먼저 성공한 회차가 커밋하면, 같은 날 뒤 회차는 변경 없어 그냥 넘어간다.
    # 분(minute)을 :00 대신 분산 → GitHub 정각 혼잡에 따른 실행 지연 회피
    - cron: '17 21 * * *'  # 06:17 KST
    - cron: '17 3 * * *'   # 12:17 KST
    - cron: '17 9 * * *'   # 18:17 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install requests pandas openpyxl

      # Supabase 무료 프로젝트는 7일 무활동 시 자동 정지됨 → 매일 가벼운 조회로 활성 유지.
      # (publishable 키는 공개용. 로그인·동기화 DB가 멈추지 않도록 유지)
      - name: Supabase 활성 유지 (keep-alive)
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w "supabase keep-alive: HTTP %{http_code}\n" --max-time 20 \
            "https://sxpfzciboqzahqdfbqvv.supabase.co/rest/v1/user_prefs?select=user_id&limit=1" \
            -H "apikey: sb_publishable_IXe_zHBNiqcLKVoiUOCxtg_-x_dEYvr" || true

      - name: 공매 데이터 수집 (onbid.json 생성)
        continue-on-error: true
        timeout-minutes: 40
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python build_onbid.py

      # 경매는 스크래핑만 ~25분 + 3만건 지오코딩 ~15분이라 넉넉히 90분.
      - name: 경매 데이터 수집 (data.json 생성)
        continue-on-error: true
        timeout-minutes: 90
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python build_data.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json geocache.json
          git add onbid.json car.json asset.json sale_results.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 생략"
          else
            git commit -m "chore: 경매/공매 데이터 자동 갱신 ($(date -u +%F))"
            # 하루 3회 실행·수동 커밋과 겹치면 원격이 앞서 push가 거부될 수 있다.
            # rebase 후 재시도해 안전하게 올린다(데이터 파일과 다른 파일 충돌 없음).
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push 재시도 $i..."; sleep 5
            done
          fi
