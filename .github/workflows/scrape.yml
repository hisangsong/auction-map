name: 법원경매물건 데이터 자동 갱신

on:
  schedule:
    - cron: '0 21 */2 * *'  # 매월 홀수일 21:00 UTC = 짝수일 06:00 KST (격일)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install requests pandas openpyxl

      - name: 데이터 수집 (data.json 생성)
        run: python build_data.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 생략"
          else
            git commit -m "chore: 법원경매물건 데이터 자동 갱신 ($(date -u +%F))"
            git push
          fi
